<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - AI Skin Care Advisor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SkinCare AI</div>
        <div class="nav-links">
            <a href="dashboard.html" data-i18n="dashboard">Dashboard</a>
            <a href="analysis.html" data-i18n="analysis">Analysis</a>
            <a href="routine.html" data-i18n="routine">Routine</a>
            <a href="progress.html" data-i18n="progress">Progress</a>
            <a href="compare.html" data-i18n="compare">Compare</a>
            <a href="community.html">Community</a>
            <a href="products.html" data-i18n="products">Products</a>
            <a href="profile.html" data-i18n="profile">Profile</a>
            <a href="settings.html" data-i18n="settings">Settings</a>
            <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()">हिं</button>
            <a href="#" id="logoutBtn" data-i18n="logout">Logout</a>
            <button class="theme-toggle" id="themeToggle"><span id="themeIcon">🌙</span></button>
        </div>
    </nav>

    <section class="community-section">
        <h1>Community</h1>
        <p>See what others are doing for their skin</p>

        <div class="share-routine-banner">
            <div>
                <h3>Share Your Routine</h3>
                <p>Got a routine that works? Share it with the community!</p>
            </div>
            <button id="openShareModal" class="btn-primary">✨ Share Routine</button>
        </div>

        <div class="modal-overlay" id="shareModal" style="display:none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Share Your Routine</h3>
                    <button class="modal-close" id="closeShareModal">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="shareTitle" placeholder="e.g., My 30-day acne routine!" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Skin Concern</label>
                        <input type="text" id="shareConcern" placeholder="e.g., acne, oily skin" maxlength="200">
                    </div>
                    <div class="form-group">
                        <label>Your Routine</label>
                        <textarea id="shareRoutine" placeholder="Paste your routine here..." rows="8" maxlength="5000"></textarea>
                    </div>
                    <button id="submitShare" class="btn-primary" style="width:100%;">Share with Community</button>
                </div>
            </div>
        </div>

        <div class="community-feed" id="communityFeed">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Loading posts...</p>
            </div>
        </div>
    </section>

    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
