<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress - AI Skin Care Advisor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">SkinCare AI</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="analysis.html">Analysis</a>
            <a href="routine.html">Routine</a>
            <a href="progress.html">Progress</a>
            <a href="products.html">Products</a>
            <a href="profile.html">Profile</a>
            <a href="settings.html">Settings</a>
            <a href="#" id="logoutBtn">Logout</a>
            <button class="theme-toggle" id="themeToggle"><span id="themeIcon">🌙</span></button>
        </div>
    </nav>

    <section class="progress-section">
        <h1>Track Your Progress</h1>
        <p>Log your skin condition daily and see your journey</p>

        <div class="progress-summary">
            <div class="summary-card">
                <div class="summary-icon">🔥</div>
                <div class="summary-value" id="streakValue">0</div>
                <div class="summary-label">Day Streak</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">📅</div>
                <div class="summary-value" id="weekAvg">0.0</div>
                <div class="summary-label">This Week Avg</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">📊</div>
                <div class="summary-value" id="totalCount">0</div>
                <div class="summary-label">Total Entries</div>
            </div>
        </div>

        <div class="progress-form">
            <h3 style="margin-bottom: 20px; color: var(--text-primary);">Add New Entry</h3>

            <div class="form-group">
                <label>Date</label>
                <input type="date" id="progressDate">
            </div>

            <div class="form-group">
                <label>Rating</label>
                <select id="progressRating">
                    <option value="1">1 - Worse</option>
                    <option value="2">2 - Bad</option>
                    <option value="3" selected>3 - Same</option>
                    <option value="4">4 - Better</option>
                    <option value="5">5 - Great</option>
                </select>
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea id="progressNotes" placeholder="How is your skin today?"></textarea>
            </div>

            <button id="addProgressBtn" class="btn-primary">Add Entry</button>
        </div>

        <div class="chart-container">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin: 0;">Progress Chart</h3>
                <div class="chart-type-toggle">
                    <button class="chart-toggle-btn active" data-type="line">📈 Line</button>
                    <button class="chart-toggle-btn" data-type="bar">📊 Bar</button>
                </div>
            </div>
            <canvas id="progressChart"></canvas>
        </div>

        <div class="progress-list">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin: 0;">Your Entries</h3>
                <button id="exportBtn" class="btn-secondary" style="padding: 8px 20px; font-size: 0.9rem;">
                    📤 Export CSV
                </button>
            </div>
            <div id="progressList"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
