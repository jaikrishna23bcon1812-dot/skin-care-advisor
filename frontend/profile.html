<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - AI Skin Care Advisor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">SkinCare AI</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="analysis.html">Analysis</a>
            <a href="progress.html">Progress</a>
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn">Logout</a>
            <button class="theme-toggle" id="themeToggle"><span id="themeIcon">🌙</span></button>
        </div>
    </nav>

    <section class="profile-section">
        <h1>My Profile</h1>
        <p>View and edit your account information</p>

        <div class="profile-card">
            <div class="profile-avatar">
                <div class="avatar-circle" id="avatarCircle">J</div>
            </div>

            <div class="profile-info">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="profileName" disabled>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" disabled>
                </div>

                <div class="form-group">
                    <label>Member Since</label>
                    <input type="text" id="profileMemberSince" disabled>
                </div>

                <button id="editProfileBtn" class="btn-primary">Edit Profile</button>
                <button id="saveProfileBtn" class="btn-primary" style="display:none;">Save Changes</button>
                <button id="cancelProfileBtn" class="btn-secondary" style="display:none;">Cancel</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
